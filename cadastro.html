<body> 

 

<header class="faixa-preta"></header> 

 

<main class="cadastro"> 

    <h1>Cadastrar Empresa</h1> 

 

    <form> 

        <p class="legenda">Dados da empresa</p> 

 

        <section class="linha"> 

            <input type="text" placeholder="CNPJ" required> 

            <input type="text" placeholder="Ramo da empresa" required> 

        </section> 

 

        <input class="campo-largo" type="number" 

               placeholder="Fretes realizados no mês" 

               min="0" required> 

 

        <p class="legenda">Informações de Contato</p> 

 

        <section class="linha"> 

            <input type="email" placeholder="E-mail comercial" required> 

            <input type="text" placeholder="CPF" required> 

        </section> 

 

        <section class="linha"> 

            <input type="text" placeholder="Nome completo" required> 

            <input type="tel" placeholder="Celular" required> 

        </section> 

 

        <p class="pergunta"> 

            Você faz parte do quadro de sócios da empresa? 

        </p> 

 

        <section class="opcoes"> 

            <label> 

                <input type="radio" name="socio" value="sim" required> 

                Sim, sou sócio 

            </label> 

 

            <label> 

                <input type="radio" name="socio" value="nao"> 

                Não sou sócio 

            </label> 

        </section> 

 

        <section class="final"> 

            <label class="termos"> 

                <input type="checkbox" required> 

                <span> 

                    Eu aceito os <a href="#">Termos de uso</a> e as 

                    <a href="#">Políticas de Privacidade</a> da Fretebras. 

                </span> 

            </label> 

 

            <section class="botoes"> 

                <button type="button" onclick="location.href='login.html'"> 

                    Finalizar 

                </button> 

 

                <button type="button" onclick="location.href='login.html'"> 

                    Voltar 

                </button> 

            </section> 

        </section> 

    </form> 

</main>
