<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rastreamento</title>
    <link rel="stylesheet" href="rastreamento.css">
</head>
<body>
   


    <header>
        <div class="logo">
            <img src="logo canva.png" alt="365 Fretes">
        </div>


        <nav>
            <a href="index.html">INÍCIO</a>
            <a href="sobrenós.html">SOBRE NÓS</a>
            <a href="serviços.html" class="ativo">SERVIÇOS</a>
            <a href="cadastra-entrar.html">CADASTRAR</a>
        </nav>
       
    </header>
         
      <a href="serviços.html" class="botao-voltar">← Voltar</a>
    <main class="container">
        <div class="caixa">
            <h1>Rastreamento de carga</h1>


            <p>
                Informe seu telefone para solicitar
                o link de rastreamento da sua carga.
            </p>


            <form id="formRastreamento">
                <label for="telefone">Número de telefone</label>


                <input
                    type="tel"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >


                <button type="submit">
                    Solicitar rastreamento
                </button>
            </form>


            <p id="mensagem" class="mensagem" role="status"></p>
        </div>
    </main>


    <script>
        const formulario = document.getElementById("formRastreamento");
        const mensagem = document.getElementById("mensagem");


        formulario.addEventListener("submit", function(event) {
            event.preventDefault();


            mensagem.textContent =
                "Link para rastreamento enviado!";


            mensagem.style.display = "block";
        });
    </script>








</body>
</html>
